<!DOCTYPE html>
<html>
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V5QGBFS43H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V5QGBFS43H');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRC Radio – Admin</title>
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <h1 class="fade-in">Admin Panel</h1>
    <p class="subtitle fade-in">System management</p>

    <div class="card fade-in">
      <div class="card-header">Reload Data</div>
      <p style="font-size: 0.88rem; color: var(--light-gray); margin-bottom: 18px;">
        Reload tracks, playlists, and pro playlists from Google Sheets.
      </p>
      <button class="primary" id="reload-btn" onclick="reloadData()">Reload All Data</button>
      <p id="status" class="status-msg"></p>
    </div>

    <script>
      async function reloadData() {
        const status = document.getElementById("status");
        const btn = document.getElementById("reload-btn");

        btn.disabled = true;
        status.className = "status-msg";
        status.style.color = "var(--light-gray)";
        status.textContent = "Reloading...";

        try {
          const res = await fetch("/admin/reload", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
          });

          const data = await res.json();
          if (res.ok) {
            status.className = "status-msg success";
            status.textContent = data.message;
          } else {
            status.className = "status-msg error";
            status.textContent = data.error || "Reload failed";
          }
        } catch (err) {
          status.className = "status-msg error";
          status.textContent = "Reload request failed.";
          console.error(err);
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
