<!DOCTYPE html>
<html>
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V5QGBFS43H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V5QGBFS43H');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRC Radio – Host</title>
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <h1 class="fade-in">Host Control Panel</h1>
    <p class="subtitle fade-in">Channel: <strong id="channel-display" style="color: var(--blue6);"></strong></p>

    <div class="card fade-in">
      <div class="card-header">Listener Link</div>
      <div class="link-field">
        <input id="listener-link" type="text" readonly />
        <button onclick="copyListenerLink()">Copy</button>
      </div>
    </div>

    <div class="card fade-in">
      <div class="card-header">Select Music</div>
      <select id="playlist-select">
        <option disabled selected>Select Playlist</option>
      </select>
      <button class="primary" onclick="changePlaylist()">Start Playlist</button>
      <p id="status" class="status-msg"></p>
    </div>

    <div class="now-playing-bar fade-in" id="np-section">
      <div class="label">Current Playlist</div>
      <div class="value" id="current-playlist">(none)</div>
      <hr class="np-divider" />
      <div class="label">Now Playing</div>
      <div class="track-value" id="now-playing">(nothing)</div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const playlistSelect = document.getElementById("playlist-select");

      const urlParams = new URLSearchParams(window.location.search);
      const CHANNEL = urlParams.get("channel");

      if (!CHANNEL) {
        alert("Missing channel name in URL. Please use ?channel=<channel name>");
      }

      document.getElementById("channel-display").textContent = CHANNEL || "(none)";

      if (CHANNEL) {
        const link = `${window.location.origin}/listen?channel=${encodeURIComponent(CHANNEL)}`;
        document.getElementById("listener-link").value = link;
      }

      function copyListenerLink() {
        const input = document.getElementById("listener-link");
        input.select();
        input.setSelectionRange(0, 99999);
        document.execCommand("copy");
        statusEl.className = "status-msg success";
        statusEl.textContent = "Link copied to clipboard";
      }

      async function fetchPlaylists() {
        try {
          const res = await fetch("/playlists");
          const data = await res.json();

          // Clear existing options safely
          while (playlistSelect.options.length > 0) {
            playlistSelect.remove(0);
          }
          const defaultOpt = document.createElement("option");
          defaultOpt.disabled = true;
          defaultOpt.selected = true;
          defaultOpt.textContent = "Select Playlist";
          playlistSelect.appendChild(defaultOpt);

          data.playlists.sort().forEach((playlist) => {
            const option = document.createElement("option");
            option.value = playlist;
            option.textContent = playlist;
            playlistSelect.appendChild(option);
          });
        } catch (err) {
          statusEl.className = "status-msg error";
          statusEl.textContent = "Failed to fetch playlists.";
          console.error(err);
        }
      }

      async function sendCommand(cmd) {
        if (!CHANNEL) return;
        try {
          const res = await fetch("/command", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channel: CHANNEL, command: cmd }),
          });
          const data = await res.json();
          if (res.ok) {
            statusEl.className = "status-msg success";
            statusEl.textContent = `Sent: ${data.channel} \u2192 ${cmd}`;
          } else {
            statusEl.className = "status-msg error";
            statusEl.textContent = `Error: ${data.error}`;
          }
        } catch (err) {
          statusEl.className = "status-msg error";
          statusEl.textContent = "Command failed.";
          console.error(err);
        }
      }

      async function changePlaylist() {
        if (!CHANNEL) return;
        const playlist = playlistSelect.value;
        if (!playlist || playlist === "Select Playlist") {
          statusEl.className = "status-msg error";
          statusEl.textContent = "No playlist selected.";
          return;
        }
        try {
          const res = await fetch("/command", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channel: CHANNEL, playlist: playlist }),
          });
          const data = await res.json();
          if (res.ok) {
            statusEl.className = "status-msg success";
            statusEl.textContent = `Now playing "${playlist}"`;
            pollNowPlaying();
          } else {
            statusEl.className = "status-msg error";
            statusEl.textContent = data.error || data.detail || "Failed";
          }
        } catch (err) {
          statusEl.className = "status-msg error";
          statusEl.textContent = "Playlist change failed.";
          console.error(err);
        }
      }

      async function pollNowPlaying() {
        if (!CHANNEL) return;
        try {
          const res = await fetch(`/nowplaying?channel=${encodeURIComponent(CHANNEL)}`);
          const data = await res.json();
          document.getElementById("current-playlist").textContent = data.playlist || "(none)";
          document.getElementById("now-playing").textContent = data.track_title || "(nothing)";
        } catch (err) {
          console.error("Failed to fetch now playing:", err);
        }
      }

      fetchPlaylists();
      pollNowPlaying();
      setInterval(pollNowPlaying, 5000);
    </script>
    <div id="site-footer" aria-hidden="true"></div>
  </body>
</html>
