<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V5QGBFS43H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V5QGBFS43H');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRC Radio</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <h1>FRC Radio – Listener</h1>

  <button id="start-button">▶️ Start Listening</button><br /><br />
  <p><strong>Listening Channel:</strong> <span id="channel-name"></span></p>
  <p><strong>Now Playing:</strong> <span id="now-playing">(not playing)</span></p>

  <audio id="radio" preload="none" style="display: none"></audio><br />

  <label for="volume">
    <span class="volume-text">
      🔉 Volume: <span id="volume-display">80%</span>
    </span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
  </label>

  <script>
    const button = document.getElementById("start-button");
    const audio = document.getElementById("radio");
    const volumeSlider = document.getElementById("volume");
    const volumeDisplay = document.getElementById("volume-display");

    const urlParams = new URLSearchParams(window.location.search);
    const channel = urlParams.get("channel");
    document.getElementById("channel-name").textContent = channel || "(none)";


    if (!channel) {
      alert("Missing channel in URL. Please use ?channel=alpha");
      button.disabled = true;
    }

    button.addEventListener("click", () => {
      console.log("🎧 Connecting to channel:", channel);

      audio.pause();
      audio.src = "";
      audio.load();

      audio.src = "/stream?channel=" + encodeURIComponent(channel) + "&_=" + Date.now();
      audio.load();
      audio.volume = parseFloat(volumeSlider.value);
      audio.style.display = "inline";
      button.style.display = "none";

      setTimeout(() => {
        audio.play().then(() => {
          console.log("🎶 Playback started");
        }).catch((err) => {
          console.error("❌ Playback error:", err);
        });
      }, 500);
    });

    volumeSlider.addEventListener("input", () => {
      const volValue = parseFloat(volumeSlider.value);
      const volPercent = Math.round(volValue * 100);
      audio.volume = volValue;
      volumeDisplay.textContent = volPercent + "%";
    });

    // Poll /nowplaying to update currently playing track
    const nowEl = document.getElementById('now-playing');
    let nowTimer = null;
    function fetchNowPlaying() {
      if (!channel) return;
      fetch('/nowplaying?channel=' + encodeURIComponent(channel)).then(r => r.json()).then(data => {
        if (!data) {
          nowEl.textContent = '(unknown)';
          return;
        }
        if (data.track_title) {
          nowEl.textContent = `${data.track_title}${data.album ? ' — ' + data.album : ''}`;
        } else if (data.track_key) {
          nowEl.textContent = `${data.track_key}${data.file_name ? ' — ' + data.file_name : ''}`;
        } else if (data.playlist) {
          nowEl.textContent = '(no track)';
        } else {
          nowEl.textContent = '(unknown)';
        }
      }).catch(err => {
        console.warn('nowplaying fetch error', err);
      });
    }

    nowTimer = setInterval(fetchNowPlaying, 5000);
    // fetch immediately
    fetchNowPlaying();
  </script>
</body>
</html>
