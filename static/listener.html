<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V5QGBFS43H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V5QGBFS43H');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRC Radio</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <h1 class="fade-in">FRC Radio</h1>
  <p class="subtitle fade-in">Channel: <strong id="channel-name" style="color: var(--blue6);"></strong></p>

  <div class="listener-hero fade-in">
    <button class="play-button" id="start-button" aria-label="Start Listening">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
  </div>

  <audio id="radio" preload="none" style="display: none"></audio>

  <div class="now-playing-bar fade-in" id="np-bar">
    <div class="label">Now Playing</div>
    <div class="track-value" id="now-playing">(not playing)</div>
    <hr class="np-divider" />
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="volume-text" style="margin: 0; white-space: nowrap;">Vol: <span id="volume-display">80%</span></span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" style="width: 100%; margin: 0;" />
    </div>
  </div>

  <script>
    const button = document.getElementById("start-button");
    const audio = document.getElementById("radio");
    const volumeSlider = document.getElementById("volume");
    const volumeDisplay = document.getElementById("volume-display");

    const urlParams = new URLSearchParams(window.location.search);
    const channel = urlParams.get("channel");
    document.getElementById("channel-name").textContent = channel || "(none)";

    if (!channel) {
      alert("Missing channel in URL. Please use ?channel=alpha");
      button.disabled = true;
    }

    button.addEventListener("click", () => {
      audio.pause();
      audio.src = "";
      audio.load();

      audio.src = "/stream?channel=" + encodeURIComponent(channel) + "&_=" + Date.now();
      audio.load();
      audio.volume = parseFloat(volumeSlider.value);
      audio.style.display = "inline";
      button.style.display = "none";

      setTimeout(() => {
        audio.play().then(() => {
          console.log("Playback started");
        }).catch((err) => {
          console.error("Playback error:", err);
        });
      }, 500);
    });

    volumeSlider.addEventListener("input", () => {
      const volValue = parseFloat(volumeSlider.value);
      audio.volume = volValue;
      volumeDisplay.textContent = Math.round(volValue * 100) + "%";
    });

    const nowEl = document.getElementById('now-playing');
    function fetchNowPlaying() {
      if (!channel) return;
      fetch('/nowplaying?channel=' + encodeURIComponent(channel)).then(r => r.json()).then(data => {
        if (!data) {
          nowEl.textContent = '(unknown)';
          return;
        }
        if (data.track_title) {
          nowEl.textContent = `${data.track_title}${data.album ? ' \u2014 ' + data.album : ''}`;
        } else if (data.track_key) {
          nowEl.textContent = `${data.track_key}${data.file_name ? ' \u2014 ' + data.file_name : ''}`;
        } else if (data.playlist) {
          nowEl.textContent = '(waiting for track...)';
        } else {
          nowEl.textContent = '(not playing)';
        }
      }).catch(err => {
        console.warn('nowplaying fetch error', err);
      });
    }

    setInterval(fetchNowPlaying, 5000);
    fetchNowPlaying();
  </script>
</body>
</html>
